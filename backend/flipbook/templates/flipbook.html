<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipbook</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- turn.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/4/turn.min.js"></script>

    <style>
        body { text-align: center; font-family: Arial, sans-serif; background: #f5f5f5; }
        
        .flipbook-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin-top: 30px; 
        }
        
        /* Flipbook wrapper */
        #flipbook { 
            width: 800px; 
            height: 600px; 
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        /* Ensure each page takes half width for double-page layout */
        #flipbook .page { 
            width: 400px; 
            height: 600px; 
            background: white;
            position: absolute;
        }

        /* Ensure images fit properly */
        #flipbook img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* Navigation buttons */
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
    </style>
</head>
<body>

    <h2>Interactive Flipbook</h2>

    <div class="flipbook-container">
        <div id="flipbook">
            {% for image in image_urls %}
                <div class="page"><img src="{{ image }}" alt="Page {{ forloop.counter }}"></div>
            {% endfor %}
        </div>
    </div>

    <div class="controls">
        <button id="prev">Previous</button>
        <button id="next">Next</button>
    </div>

    <script>
        $(document).ready(function() {
            console.log("Initializing flipbook...");

            setTimeout(function() {
                if ($("#flipbook").length) {
                    $("#flipbook").turn({
                        width: 800,
                        height: 600,
                        autoCenter: true,
                        display: "double",  // Ensures proper left/right pages
                        elevation: 50,
                        gradients: true,
                        acceleration: true,
                        when: {
                            turned: function(event, page, view) {
                                console.log("Turned to page: " + page);
                            }
                        }
                    });

                    console.log("Flipbook initialized successfully!");
                } else {
                    console.error("Flipbook container not found!");
                }
            }, 500); // Small delay to ensure all elements load

            // Navigation buttons
            $("#prev").click(function() {
                $("#flipbook").turn("previous");
            });

            $("#next").click(function() {
                $("#flipbook").turn("next");
            });
        });
    </script>

</body>
</html>
